headers:
  - path: /*
    name: X-Frame-Options
    value: sameorigin
  - path: /blog/*
    name: Cache-Control
    value: must-revalidate 
 # A static site
  - type: web
    name: my-blog
    runtime: static
    buildCommand: yarn build
    staticPublishPath: ./build
    previews:
      generation: automatic # Enable service previews
    buildFilter:
      paths:
        - src/**/*.js
      ignoredPaths:
        - src/**/*.test.js
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
    routes:
  - type: redirect
    source: /a
    destination: /b
  - type: rewrite
    source: /app/*
    destination: /app
    ipAllowList: # Optional (defaults to allow all); Scale and Enterprise workspaces only
      - source: 203.0.113.4/30
        description: office
      - source: 198.51.100.1
        description: home